<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" th:href="@{/imgs/LogoTipoFINAL.png}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <main class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <article class="login-card w-100 shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 450px;">
            <header class="login-header bg-primary text-white p-5 text-center">
                <div class="login-logo mb-3">
                    <img th:src="@{/imgs/LogoTipoFINAL.png}" alt="Logo Gestor Salud" style="height: 60px;">
                </div>
                <h1 class="h3 mb-1 fw-bold">Gestor Salud</h1>
                <p class="mb-0 opacity-75">Sistema de Gestión Clínica</p>
            </header>

            <div class="login-body p-4 p-md-5 bg-white">
                <form th:action="@{/login}" method="post" aria-labelledby="login-title">
                    <h2 id="login-title" class="h5 mb-4 text-center fw-bold text-dark">Acceso al Sistema</h2>

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
                        <div>
                            <span th:text="${error}">Error al iniciar sesión</span>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold small text-uppercase tracking-wider text-muted">
                            <i class="bi bi-envelope me-1" aria-hidden="true"></i> Correo Electrónico
                        </label>
                        <input type="email" class="form-control form-control-lg shadow-sm" id="email" name="email"
                               placeholder="ejemplo@correo.com" required autocomplete="username">
                    </div>

                    <div class="mb-5">
                        <label for="dni" class="form-label fw-bold small text-uppercase tracking-wider text-muted">
                            <i class="bi bi-lock me-1" aria-hidden="true"></i> Contraseña
                        </label>
                        <input type="password" class="form-control form-control-lg shadow-sm" id="dni" name="dni"
                               placeholder="••••••••" required autocomplete="current-password">
                        <div class="form-text mt-2 small text-muted">
                            <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
                            Introduce tu DNI/Contraseña registrada.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm py-3 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i> Entrar al Sistema
                    </button>
                </form>
            </div>

            <footer class="login-footer bg-light p-4 text-center border-top">
                <p class="mb-0 small text-muted">&copy; 2026 Gestor Salud. Todos los derechos reservados.</p>
            </footer>
        </article>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
