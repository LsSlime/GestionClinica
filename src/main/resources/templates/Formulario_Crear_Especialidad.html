<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Especialidad</title>
    <link rel="stylesheet" href="/css/formulario_base.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .form-header {
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        .form-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-header p {
            font-size: 1rem;
            opacity: 0.95;
        }

        .form-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .form-body {
            padding: 3rem 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-label i {
            color: #0066cc;
            font-size: 1.1rem;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #999;
        }

        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 1.5rem;
            padding: 1rem 1.25rem;
        }

        .alert-danger {
            background: #ffe6e6;
            color: #c00;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #0066cc;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            color: #555;
            font-size: 0.9rem;
        }

        .info-box i {
            color: #0066cc;
            margin-right: 0.5rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #e0e0e0;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 204, 0.3);
        }

        .btn-cancel {
            flex: 1;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background: #f8f9fa;
            border: 2px dashed #0066cc;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #0066cc;
            font-weight: 600;
        }

        .file-input-label:hover {
            background: #e8f0ff;
            border-color: #0052a3;
        }

        .file-input-label i {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .file-name {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.5rem;
            max-width: 100%;
            word-break: break-word;
        }

        .preview-image {
            margin-top: 1rem;
            text-align: center;
        }

        .preview-image img {
            max-width: 200px;
            height: auto;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        @media (max-width: 576px) {
            .button-group {
                flex-direction: column;
            }

            .form-body {
                padding: 2rem 1.5rem;
            }

            .form-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold d-flex align-items-center" th:href="@{/menu}">
            <img src="/imgs/LogoTipoFINAL.png" alt="Logo Gestor Clínico" style="height: 40px; margin-right: 10px;">
            Gestor Salud
        </a>
    </div>
</nav>

<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1><i class="bi bi-bookmark-heart"></i> Nueva Especialidad</h1>
            <p>Crea una nueva especialidad médica en el sistema</p>
        </div>

        <div class="form-body">
            <div th:if="${error}" class="alert alert-danger">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="info-box">
                <i class="bi bi-info-circle"></i>
                Las especialidades son categorías médicas que los médicos pueden atender.
            </div>

            <form th:action="@{/especialidades/guardar}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="nombre" class="form-label">
                        <i class="bi bi-file-text"></i> Nombre de la Especialidad
                    </label>
                    <input type="text" class="form-control" id="nombre" name="nombre"
                           th:value="${especialidad.nombre}"
                           placeholder="Ej: Cardiología, Pediatría, Dermatología..."
                           required>
                    <div style="font-size: 0.85rem; color: #6c757d; margin-top: 0.5rem;">
                        Ingresa el nombre único de la especialidad
                    </div>
                </div>

                <div class="form-group">
                    <label for="archivo" class="form-label">
                        <i class="bi bi-image"></i> Imagen de la Especialidad
                    </label>
                    <div class="file-input-wrapper">
                        <input type="file" id="archivo" name="archivo" accept="image/*" onchange="mostrarNombreArchivo(this)">
                        <label for="archivo" class="file-input-label">
                            <i class="bi bi-cloud-upload"></i>
                            <div>Haz clic para seleccionar una imagen</div>
                            <small style="color: #6c757d; font-weight: 400;">o arrastra una imagen aquí</small>
                        </label>
                    </div>
                    <div id="fileName" class="file-name"></div>
                    <div id="preview" class="preview-image"></div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-check-circle"></i> Guardar Especialidad
                    </button>
                    <a th:href="@{/especialidades}" class="btn-cancel">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function mostrarNombreArchivo(input) {
        const fileNameDiv = document.getElementById('fileName');
        const previewDiv = document.getElementById('preview');

        if (input.files && input.files[0]) {
            const file = input.files[0];
            fileNameDiv.textContent = 'Archivo: ' + file.name;

            // Mostrar preview de la imagen
            const reader = new FileReader();
            reader.onload = function(e) {
                previewDiv.innerHTML = '<img src="' + e.target.result + '" alt="Preview">';
            };
            reader.readAsDataURL(file);
        } else {
            fileNameDiv.textContent = '';
            previewDiv.innerHTML = '';
        }
    }

    // Drag and drop
    const fileInput = document.getElementById('archivo');
    const label = document.querySelector('.file-input-label');

    label.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.style.background = '#e8f0ff';
        this.style.borderColor = '#0052a3';
    });

    label.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.style.background = '#f8f9fa';
        this.style.borderColor = '#0066cc';
    });

    label.addEventListener('drop', function(e) {
        e.preventDefault();
        this.style.background = '#f8f9fa';
        this.style.borderColor = '#0066cc';

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            fileInput.files = files;
            mostrarNombreArchivo(fileInput);
        }
    });
</script>

</body>
</html>
