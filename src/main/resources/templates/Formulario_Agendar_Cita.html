<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Agendar cita</h1>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
                        <div class="mb-3">
                            <label for="paciente" class="form-label">Paciente</label>
                            <select class="form-select" th:field="*{paciente.id}" id="paciente" required>
                                <option value="0">Selecciona un paciente</option>
                                <option th:each="paciente : ${pacientes}"
                                        th:value="${paciente.id}"
                                        th:text="${paciente.nombre + ' ' + paciente.apellido1}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="especialidad" class="form-label">Especialidad</label>
                            <select class="form-select"
                                    id="especialidad"
                                    name="especialidadId"
                                    th:attr="data-url-base=@{/medicos/por-especialidad/}"
                                    onchange="cargarMedicos(this.value)"
                                    required>
                                <option value="">Selecciona especialidad</option>
                                <option th:each="esp : ${especialidades}"
                                        th:value="${esp.id}"
                                        th:selected="${especialidadSeleccionada != null && especialidadSeleccionada == esp.id}"
                                        th:text="${esp.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="medico" class="form-label">Medico</label>
                            <select class="form-select" th:field="*{medico.id}" id="medico" required>
                                <option value="0">Selecciona primero una especialidad</option>
                                <option th:each="medicoDisponible : ${medicosDisponibles}"
                                        th:value="${medicoDisponible.id}"
                                        th:selected="${cita.medico != null && cita.medico.id == medicoDisponible.id}"
                                        th:text="${medicoDisponible.nombre + ' ' + medicoDisponible.apellido1}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fechaHora" class="form-label">Fecha y hora</label>
                            <input type="datetime-local" class="form-control" th:field="*{fechaHora}" id="fechaHora" required>
                        </div>

                        <div class="mb-3">
                            <label for="motivo" class="form-label">Motivo</label>
                            <input type="text" class="form-control" th:field="*{motivo}" id="motivo" required>
                        </div>

                        <div class="mb-4">
                            <label for="descripcion" class="form-label">Descripcion</label>
                            <textarea class="form-control" th:field="*{descripcion}" id="descripcion" rows="4"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Agendar cita</button>
                            <a th:href="@{/citas}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function cargarMedicos(idEspecialidad) {
        const especialidad = document.getElementById('especialidad');
        const select = document.getElementById('medico');
        select.innerHTML = '<option value="0">Selecciona un medico</option>';
        if (!idEspecialidad) {
            return;
        }
        fetch(especialidad.dataset.urlBase + idEspecialidad)
            .then(res => res.json())
            .then(medicos => {
                medicos.forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.nombre} ${m.apellido1}</option>`;
                });
            });
    }
</script>
</body>
</html>
