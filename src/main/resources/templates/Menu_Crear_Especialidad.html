<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especialidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/Menu_especialidad.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold d-flex align-items-center" th:href="@{/menu}">
            <img th:src="@{/imgs/LogoTipoFINAL.png}" alt="Logo Gestor Clínico" style="height: 40px; margin-right: 10px;">
            Gestor Salud
        </a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <h1>Especialidades Médicas</h1>
            <p>Listado de todas las especialidades disponibles en el sistema</p>
        </div>
        <a th:href="@{/especialidades/nuevo}" class="btn-nueva">
            <i class="bi bi-plus-circle"></i> Nueva Especialidad
        </a>
    </div>

    <div th:if="${error}" class="error-banner">
        <i class="bi bi-exclamation-triangle"></i>
        <span th:text="${error}"></span>
    </div>

    <div th:if="${#lists.isEmpty(especialidades)}" class="empty-state">
        <i class="bi bi-inbox"></i>
        <h3>No hay especialidades registradas</h3>
        <p>Comienza creando una nueva especialidad en el sistema</p>
        <a th:href="@{/especialidades/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Crear Primera Especialidad
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(especialidades)}" class="especialidades-grid">
        <div th:each="especialidad : ${especialidades}" class="especialidad-card">
            <div class="card-imagen-container">
                <img th:if="${especialidad.imagenUrl}" th:src="${especialidad.imagenUrl}" th:alt="${especialidad.nombre}">
                <i th:unless="${especialidad.imagenUrl}" class="bi bi-hospital"></i>
            </div>
            <div class="card-body-custom">
                <div class="card-nombre" th:text="${especialidad.nombre}">Especialidad</div>
                <div style="text-align: center;">
                    <span class="card-badge">
                        <i class="bi bi-check-circle"></i> Activa
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
