<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Citas</h1>
            <p class="text-secondary mb-0">Listado general de citas registradas.</p>
        </div>
        <a th:href="@{/citas/nueva}" class="btn btn-primary">Nueva cita</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(citas)}" class="alert alert-info mb-0">
                No hay citas registradas todavia.
            </div>

            <div th:unless="${#lists.isEmpty(citas)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Medico</th>
                        <th>Especialidad</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cita : ${citas}">
                        <td th:text="${cita.paciente.nombre + ' ' + cita.paciente.apellido1}">Paciente</td>
                        <td th:text="${cita.medico.nombre + ' ' + cita.medico.apellido1}">Medico</td>
                        <td th:text="${cita.medico.especialidad.nombre}">Especialidad</td>
                        <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                        <td th:text="${cita.estado}">programada</td>
                        <td class="text-end">
                            <form th:if="${cita.estado != 'cancelada'}" th:action="@{/citas/cancelar/{id}(id=${cita.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
