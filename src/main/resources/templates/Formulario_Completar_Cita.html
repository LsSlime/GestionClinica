<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/form_completar_citas.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-semibold d-flex align-items-center" th:href="@{/menu}">
                <img src="/imgs/LogoTipoFINAL.png" alt="Logo Gestor Clínico" style="height: 40px; margin-right: 10px;">
                Gestor Salud
            </a>
        </div>
    </nav>
    <main class="container pb-5">
        <div class="form-container">
            <article class="form-card shadow-lg border-0 rounded-4 overflow-hidden">
                <header class="form-header bg-success text-white p-4 text-center">
                    <h1 class="h2 mb-1"><i class="bi bi-check-circle" aria-hidden="true"></i> Completar Cita Médica</h1>
                    <p class="mb-0 opacity-75">Registra los detalles de la consulta y marca la cita como completada</p>
                </header>

                <div class="form-body p-4 p-md-5 bg-white">
                    <!-- Información de la Cita -->
                    <section class="info-section mb-5 p-4 bg-light rounded-3 border-start border-success border-4" aria-labelledby="titulo-info">
                        <h2 id="titulo-info" class="h5 mb-3 fw-bold text-success">
                            <i class="bi bi-info-circle me-2" aria-hidden="true"></i> Información de la Cita
                        </h2>
                        <div class="row g-3">
                            <article class="col-md-6">
                                <span class="fw-bold small text-muted text-uppercase">Paciente:</span>
                                <div class="fw-medium text-dark" th:text="${cita.paciente.nombre + ' ' + cita.paciente.apellido1 + ' ' + cita.paciente.apellido2}">Nombre Paciente</div>
                            </article>
                            <article class="col-md-6">
                                <span class="fw-bold small text-muted text-uppercase">Fecha y Hora:</span>
                                <div class="fw-medium text-dark" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</div>
                            </article>
                            <article class="col-12">
                                <span class="fw-bold small text-muted text-uppercase">Motivo:</span>
                                <div class="fw-medium text-dark" th:text="${cita.motivo}">Motivo</div>
                            </article>
                            <article th:if="${cita.descripcion}" class="col-12">
                                <span class="fw-bold small text-muted text-uppercase">Descripción:</span>
                                <div class="fw-medium text-dark" th:text="${cita.descripcion}">Descripción</div>
                            </article>
                        </div>
                    </section>

                    <!-- Formulario -->
                    <form th:action="@{/citas/completar}" th:object="${cita}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <section class="mb-4" aria-labelledby="seccion-resultado">
                            <h2 id="seccion-resultado" class="visually-hidden">Resultado de la consulta</h2>

                            <div class="mb-4">
                                <label for="diagnostico" class="form-label fw-bold">
                                    <i class="bi bi-clipboard-data text-muted me-1" aria-hidden="true"></i> Diagnóstico
                                </label>
                                <textarea class="form-control shadow-sm" id="diagnostico" th:field="*{diagnostico}" rows="3"
                                        placeholder="Describe el diagnóstico realizado durante la consulta"></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="tratamiento" class="form-label fw-bold">
                                    <i class="bi bi-capsule text-muted me-1" aria-hidden="true"></i> Tratamiento
                                </label>
                                <textarea class="form-control shadow-sm" id="tratamiento" th:field="*{tratamiento}" rows="3"
                                        placeholder="Especifica el tratamiento prescrito" required></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="observaciones" class="form-label fw-bold">
                                    <i class="bi bi-chat-dots text-muted me-1" aria-hidden="true"></i> Observaciones
                                </label>
                                <textarea class="form-control shadow-sm" id="observaciones" th:field="*{observaciones}" rows="3"
                                        placeholder="Añade cualquier observación adicional sobre la consulta" required></textarea>
                            </div>
                        </section>

                        <div th:if="${error}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                            <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>
                            <span th:text="${error}">Error</span>
                        </div>

                        <div class="button-group d-flex flex-column flex-md-row gap-3 mt-5">
                            <button type="submit" class="btn btn-success btn-lg flex-grow-1 shadow-sm py-3 fw-bold">
                                <i class="bi bi-check-circle me-2" aria-hidden="true"></i> Completar Cita
                            </button>
                            <a th:href="@{/medicos/menu}" class="btn btn-outline-secondary btn-lg flex-grow-1 py-3 fw-bold">
                                <i class="bi bi-arrow-left me-2" aria-hidden="true"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </article>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOHmy+McmqTp7z5YFA8aGkB1K" crossorigin="anonymous"></script>
</body>
</html>
