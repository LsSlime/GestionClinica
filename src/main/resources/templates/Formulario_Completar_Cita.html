<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .form-header {
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        .form-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-header p {
            font-size: 1rem;
            opacity: 0.95;
        }

        .form-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 700px;
        }

        .form-body {
            padding: 2rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-cancel {
            background: #6c757d;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 10px;
            margin-left: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            padding: 0.75rem;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .info-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .info-label {
            font-weight: 600;
            color: #495057;
        }

        .info-value {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-card">
            <div class="form-header">
                <h1><i class="bi bi-check-circle"></i> Completar Cita Médica</h1>
                <p>Registra los detalles de la consulta y marca la cita como completada</p>
            </div>
            <div class="form-body">
                <!-- Información de la Cita -->
                <div class="info-section">
                    <h5 class="mb-3"><i class="bi bi-info-circle"></i> Información de la Cita</h5>
                    <div class="info-item">
                        <span class="info-label">Paciente:</span>
                        <span class="info-value" th:text="${cita.paciente.nombre + ' ' + cita.paciente.apellido1 + ' ' + cita.paciente.apellido2}">Nombre Paciente</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Fecha y Hora:</span>
                        <span class="info-value" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Motivo:</span>
                        <span class="info-value" th:text="${cita.motivo}">Motivo</span>
                    </div>
                    <div th:if="${cita.descripcion}" class="info-item">
                        <span class="info-label">Descripción:</span>
                        <span class="info-value" th:text="${cita.descripcion}">Descripción</span>
                    </div>
                </div>

                <!-- Formulario -->
                <form th:action="@{/citas/completar}" th:object="${cita}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-group">
                        <label for="diagnostico" class="form-label">
                            <i class="bi bi-clipboard-data"></i> Diagnóstico
                        </label>
                        <textarea class="form-control" id="diagnostico" th:field="*{diagnostico}" rows="3"
                                  placeholder="Describe el diagnóstico realizado durante la consulta"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="tratamiento" class="form-label">
                            <i class="bi bi-capsule"></i> Tratamiento
                        </label>
                        <textarea class="form-control" id="tratamiento" th:field="*{tratamiento}" rows="3"
                                  placeholder="Especifica el tratamiento prescrito" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="observaciones" class="form-label">
                            <i class="bi bi-chat-dots"></i> Observaciones
                        </label>
                        <textarea class="form-control" id="observaciones" th:field="*{observaciones}" rows="3"
                                  placeholder="Añade cualquier observación adicional sobre la consulta" required></textarea>
                    </div>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-submit">
                            <i class="bi bi-check-circle"></i> Completar Cita
                        </button>
                        <a th:href="@{/medicos/menu}" class="btn btn-cancel">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOHmy+McmqTp7z5YFA8aGkB1K" crossorigin="anonymous"></script>
</body>
</html>
